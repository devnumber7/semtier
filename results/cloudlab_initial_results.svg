<rect x="799" y="256.9" width="66" height="138.1" fill="#2f80ed" rx="4"/>
<text x="832.0" y="247.9" text-anchor="middle" font-size="13" font-weight="700" fill="#202124">78.2</text>
<text x="832.0" y="419" text-anchor="middle" font-size="12" font-weight="400" fill="#222"><tspan x="832.0" dy="0">SemTier</tspan><tspan x="832.0" dy="13.799999999999999">fast=1</tspan></text>
