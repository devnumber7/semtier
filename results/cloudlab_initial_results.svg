<path d="M456 136 C440 118, 396 117, 372 184" fill="none" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="389" y="108" font-size="12" fill="#333">malloc remote is 1.63x slower</text>
<text x="389" y="124" font-size="12" fill="#333">than malloc local</text>
<path d="M244 202 C229 178, 194 177, 180 240" fill="none" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="195" y="167" font-size="12" fill="#333">SemTier fast=1 did not</text>
<text x="195" y="183" font-size="12" fill="#333">move memory to node1</text>
